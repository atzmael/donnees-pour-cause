name: Actualiser les feux de forêt

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branche à actualiser"
        required: true
        default: main
        type: choice
        options:
          - main
          - preprod

permissions:
  contents: write

concurrency:
  group: update-forest-fire-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || 'main' }}
    steps:
      - name: Récupérer la branche cible
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activer pnpm
        run: corepack enable

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Actualiser les données
        run: |
          updated=false
          for attempt in 1 2 3; do
            if pnpm data:forest-fires; then
              updated=true
              break
            fi
            echo "Tentative ${attempt}/3 échouée, nouvelle tentative dans 20 secondes."
            sleep 20
          done
          if [ "$updated" != "true" ]; then
            echo "::warning::EFFIS ou BDIFF est indisponible. Les dernières données valides sont conservées."
            git restore public/data/forest-fires.json public/data/population-exposure.json
          fi

      - name: Actualiser les validations EFFIS et FR-Alert
        run: pnpm data:fire-verification

      - name: Vérifier le calcul d’exposition
        run: pnpm data:population-exposure:check

      - name: Publier uniquement si les données ont changé
        run: |
          if git diff --quiet -- public/data/forest-fires.json public/data/population-exposure.json public/data/effis-current-fires.json public/data/official-fire-confirmations.json; then
            echo "Aucune nouvelle donnée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/forest-fires.json public/data/population-exposure.json public/data/effis-current-fires.json public/data/official-fire-confirmations.json
          git commit -m "data: actualise les feux de forêt"
          git push origin HEAD:${TARGET_BRANCH}
