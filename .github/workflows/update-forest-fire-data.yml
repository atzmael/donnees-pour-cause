name: Actualiser les feux de forêt

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-forest-fire-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer preprod
        uses: actions/checkout@v4
        with:
          ref: preprod

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activer pnpm
        run: corepack enable

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Actualiser les données
        run: pnpm data:forest-fires

      - name: Publier uniquement si les données ont changé
        run: |
          if git diff --quiet -- public/data/forest-fires.json; then
            echo "Aucune nouvelle donnée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/forest-fires.json
          git commit -m "data: actualise les feux de forêt"
          git push origin HEAD:preprod
